<!doctype html>
<html lang="tr" dir="ltr" data-bs-theme="light" data-assets-path="assets/">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Raykonsept - Giriş Yap</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/demo.css" />

    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-container {
        width: 100%;
        max-width: 400px;
      }
      .card {
        box-shadow: 0 0.5rem 2.5rem rgba(0, 0, 0, 0.2);
      }
      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-header img {
        max-width: 120px;
        margin: 0 auto;
        display: block;
        margin-bottom: 1rem;
      }
      .login-header h3 {
        color: white;
        margin: 0;
        font-weight: 700;
      }
      .login-header p {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.9rem;
        margin-top: 0.5rem;
      }
      .form-control, .btn {
        padding: 0.75rem 1rem;
      }
      .btn-login {
        padding: 0.75rem;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
      }
      .btn-login:hover {
        background: linear-gradient(135deg, #5568d3 0%, #6a3f8f 100%);
      }
      .demo-info {
        background-color: #f8f9fa;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      .demo-info strong {
        color: #667eea;
      }
      .logo-white {
        filter: brightness(0) invert(1);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <img src="assets/img/logo/logo.svg" alt="Raykonsept Logo" class="logo-white" />
        <p>Mimar Dashboard</p>
      </div>

      <div class="card">
        <div class="card-body p-4">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Kullanıcı Adı</label>
              <input
                type="text"
                class="form-control"
                id="username"
                value="demo"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Şifre</label>
              <input
                type="password"
                class="form-control"
                id="password"
                value="demo"
                required
              />
            </div>

            <button type="submit" class="btn btn-login btn-primary w-100">
              Giriş Yap
            </button>
          </form>

          <div class="demo-info">
            <strong>📌 Demo Bilgileri:</strong><br>
            Kullanıcı: <code>demo</code><br>
            Şifre: <code>demo</code>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Demo login kontrolü
        if (username === 'demo' && password === 'demo') {
          // Session kaydet
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('username', username);
          localStorage.setItem('loginTime', new Date().toLocaleString('tr-TR'));

          // Dashboard'a yönlendir
          window.location.href = 'dashboard.html';
        } else {
          alert('Kullanıcı adı veya şifre hatalı!');
        }
      });

      // Login sayfasına gelmişse ve zaten logged in ise, dashboard'a gönder
      if (localStorage.getItem('isLoggedIn') === 'true') {
        window.location.href = 'dashboard.html';
      }
    </script>
  </body>
</html>

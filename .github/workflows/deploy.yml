name: Deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/plesk_key
          chmod 600 ~/.ssh/plesk_key
          ssh -i ~/.ssh/plesk_key -o StrictHostKeyChecking=no root@${{ secrets.PLESK_SSH_HOST }} "cd /var/www/vhosts/raykonsept.com/mimar.raykonsept.com && sudo -u raykonsept ./deploy.sh"

      - name: Verify deployment
        run: |
          for i in {1..30}; do
            if curl -s https://mimar.raykonsept.com/ > /dev/null 2>&1; then
              echo "✓ Site is up"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          exit 1
